filetype:
  "css"

detect:
  filetype: "\\.css$"

rules:
    # Identifiers
  - identifier: "[a-zA-Z_][\\w-]*"
    # Numeric values
  - constant.number: "(?i)\\d+(\\.\\d+)?(%|[cm]m|Q|in|p[xtc]|(cq|[sld]?v)([whib]|min|max)|(r)?(e[mx]|cap|ch|ic|lh)|deg|turn|ms|s|kHz|Hz)?"
    # Identifiers w/ digits
  - identifier: "[a-zA-Z_][\\w-]*([0-9]+[\\w-]*)+"
    # Joker selector
  - preproc: "\\*"
    # Properties
  - identifier: "[a-zA-Z_][\\w-]*: "
    # 'all' property
  - special: "all: "
    # '!important' statement
  - statement: "!important"
    # Custom properties
  - identifier: "--[a-zA-Z_][\\w-]*"
    # Functions
  - identifier.function: "[a-zA-Z_][\\w-]*\\("
    # 'var()' function
  - preproc: "var\\("
    # Pseudo-classes
  - identifier.class: ":[a-zA-Z_][\\w-]*"
    # Pseudo-elements
  - identifier.class: "::[a-zA-Z_][\\w-]*"
    # Rules
  - preproc: "@[a-zA-Z_][\\w-]*"
    # Special characters
  - symbol.operator: "[:;>,\\.&]"
  - symbol.brackets: "[(){}]"
    # Class selectors
  - special: "\\.[a-zA-Z_][\\w-]*"
    # Id selectors
  - special: "#[a-zA-Z_][\\w-]*"
    # Hex colors
  - constant: "(?i)#(\\[\\da-f]{8}|[\\da-f]{6}|[\\da-f]{4}|[\\da-f]{3})"
    # Comments
  - comment: "//.*$"
  - comment:
      start: "/\\*"
      end: "\\*/"
