filetype: typelanguage

detect:
    filename: "\\.tl"

rules:
    - symbol: "[:=]"
    - special: "[{}[\\];]"

    - identifier.class: ":(?:flags[0-9]?\\.[0-9]+\\?)?([a-zA-Z0-9_!<>]+)"

    - type: "=\\s*([A-Za-z0-9_<>!.]+)\\s*;"

    - constant.bool: "[a-zA-Z0-9_]+:(#|flags\\.[0-9]+\\?)"
    - constant.specialChar: "#[a-fA-F0-9]+"

    - preproc: "---(functions|types)---"

    - comment:
        start: "//"
        end: "$"
        rules:
            - todo: "(TODO|XXX|FIXME):?"

    - comment:
        start: "/\\*"
        end: "\\*/"
        rules:
            - todo: "(TODO|XXX|FIXME):?"
