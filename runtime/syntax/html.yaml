filetype:
  "html"

detect:
  filename: "\\.htm(l)?$"

rules:
  - statement: "<(/)?(?i)([a-z][a-z0-9]*)"
  - special: "<meta"
  - symbol.bracket: "</|<|/>|>"
  - identifier: "[A-Za-z]+="
  - symbol: "="
  - preproc: "<!(?i)(DOCTYPE html)>"
  - special:
      start: "<style>"
      end: "</style>"
      rules:
        - include: "css"
  - constant.string:
      start: "'"
      end: "'"
      skip: '\\"'
      rules:
        - constant.specialChar: '\\\\"'
        - constant.string.url: "(ftp(s)?|http(s)?|git|chrome)://\\S+"
  - constant.string:
      start: '"'
      end: '"'
      skip: '\\"'
      rules:
        - constant.specialChar: "\\\\'"
        - constant.string.url: "(ftp(s)?|http(s)?|git|chrome)://\\S+"
  - comment:
      start: "<!--"
      end: "-->"
