filetype:
  "python"

detect:
  filename: "\\.py(3|w)?$"
  header: "^#!.*/(env +)?python(3)?$"

rules:
    # unicode identifiers
  - error: "\\pL"
    # identifiers
  - identifier: "\\b[A-Za-z_]\\w*\\b"
    # 'match' statements (Python 3.10+)
  - statement: "^\\s*match"
    # 'case' statements (Python 3.10+)
  - statement: "^\\s*case"
    # fix non-keyword 'match' and 'case'
  - identifier: "^\\s*(?:match|case)\\s*[:=]"
  - identifier: "^\\s*(?:match|case)\\w+"
    # built-in types
  - type: "\\b(?:bool|bytearray|bytes|classmethod|complex|dict|enumerate|filter|float|frozenset|int|list|map|memoryview|object|property|range|reversed|set|slice|staticmethod|str|super|tuple|type|zip)\\b"
    # 'type' statements (Python 3.12+)
  - statement: "^\\s*type"
    # fix non-keyword 'type'
  - type: "^\\s*(?:type)\\s*[:=]"
  - identifier: "^\\s*(?:type)\\w+"
    # user-defined type names
  - type: "\\b_*[A-Z]\\w*\\b"
    # constant names
  - constant: "\\b_*[A-Z][A-Z\\d_]+\\b"
    # built-in objects
  - constant: "\\b(?:Ellipsis|None|NotImplemented|self|cls)\\b"
    # boolean constants
  - constant.bool.true: "\\bTrue\\b"
  - constant.bool.false: "\\bFalse\\b"
    # built-in attributes
  - special: "\\b__(bases|builtin|class|debug|dict|doc|file|members|methods|name|self)__\\b"
    # built-in functions
  - constant.builtin: "\\b(abs|all|any|ascii|bin|breakpoint|bytearray|bytes|callable|chr|classmethod|compile|complex|delattr|dir|divmod|eval|exec|exit|format|getattr|globals|hasattr|hash|help|hex|id|input|isinstance|issubclass|iter|len|locals|max|min|next|nonlocal|oct|open|ord|pow|print|quit|repr|round|setattr|sorted|sum|vars|__import__)\\b"
    # calls
  - identifier.function: "\\b[A-Za-z_]\\w*\\("
    # 'def' statements
  - identifier.function: "^\\s*def [A-Za-z_]\\w*\\w*"
    # special method names
  - special: "\\b__(?:abs|add|and|call|cmp|coerce|complex|concat|contains|delattr|delitem|delslice|del|dict|divmod|div|float|getattr|getitem|getslice|hash|hex|iadd|iand|iconcat|ifloordiv|ilshift|imatmul|imod|imul|init|int|invert|inv|ior|ipow|irshift|isub|iter|itruediv|ixor|len|long|lshift|mod|mul|neg|next|nonzero|oct|or|pos|pow|radd|rand|rcmp|rdivmod|rdiv|repeat|repr|rlshift|rmod|rmul|ror|rpow|rrshift|rshift|rsub|rxor|setattr|setitem|setslice|str|sub|xor)__\\b"
    # 'class' statements
  - identifier.class: "^\\s*class _*[A-Z]\\w*"
    # classes initialization
  - type: "\\b_*(?:[A-Z][a-z\\d_]+)+\\("
  - type: "\\b_*[A-Z]\\("
    # keywords
  - statement: "\\b(?:assert|await|break|continue|del|elif|else|except|finally|for|if|import|pass|raise|return|try|while|yield)\\b"
    # declaration keywords
  - statement.declaration: "\\b(?:as|class|def|from|import|with)\\b"
    # 'yield from' statement
  - statement: "\\byield +from\\b"
    # 'type' statement
  - statement.declaration: "^\\s*type\\b"
    # macro-like keywords
  - preproc: "\\b(?:global|nonlocal)\\b"
    # logical operation keywords
  - symbol.operator: "\\b(?:and|is|in|not|or)\\b"
    # 'async' keyword
  - type.keyword: "\\b(?:async)\\b"
    # '=' non-operator
  - symbol: "="
    # operators
  - symbol.operator: "~|==|!=|([-+*/%@<>&|^]|\\*\\*|//)(=)?"
    # symbols
  - symbol: ":=|->|[:;.,]"
    # 'except*' keyword
  - statement: "except\\*"
    # decorators
  - preproc: "^\\s*@[a-z_][\\w\\.]*"
    # brackets
  - symbol.brackets: "[(){}]|\\[|\\]"
    # bad identifiers (digit at the start)
  - error: "\\b\\d\\w+\\b"
    # numbers
  - constant.number: "\\b[0-9]+(_[0-9]+)*(\\.([0-9](_?[0-9])*)?)?(e[0-9]+(_[0-9]+)*)?\\b"
  - constant.number: "\\b0b[01]+(_[01]+)*\\b"
  - constant.number: "\\b0o[0-7]+(_[0-7]+)*\\b"
  - constant.number: "(?i)\\b0x[\\da-f]+(_[\\d0-9a-f]+)*\\b"
    # format/raw/unicode strings
  - constant.string:
      start: "(?i)(f|r|u|fr|rf)?\"\"\""
      end: "\"\"\""
      rules:
        - constant.specialChar: "\\\\u[0-9a-fA-F]{4}"
        - constant.specialChar: "\\\\U[0-9a-fA-F]{8}"
        - constant.specialChar: "\\\\0[0-7]{2}"
        - constant.specialChar: "\\\\x[0-9a-fA-F]{2}"
        - constant.specialChar: "\\\\[abnrtv0\\\\'\"]"
  - constant.string:
      start: "(?i)(f|r|u|fr|rf)?'''"
      end: "'''"
      rules:
        - constant.specialChar: "\\\\u[0-9a-fA-F]{4}"
        - constant.specialChar: "\\\\U[0-9a-fA-F]{8}"
        - constant.specialChar: "\\\\0[0-7]{2}"
        - constant.specialChar: "\\\\x[0-9a-fA-F]{2}"
        - constant.specialChar: "\\\\[abnrtv0\\\\'\"]"
  - constant.string:
      start: "(?i)(f|r|u|fr|rf)?\""
      end: "(\"|$)"
      skip: '\\"'
      rules:
        - constant.specialChar: "\\\\u[0-9a-fA-F]{4}"
        - constant.specialChar: "\\\\U[0-9a-fA-F]{8}"
        - constant.specialChar: "\\\\0[0-7]{2}"
        - constant.specialChar: "\\\\x[0-9a-fA-F]{2}"
        - constant.specialChar: "\\\\[abnrtv0\\\\'\"]"
  - constant.string:
      start: "(?i)(f|r|u|fr|rf)?'"
      end: "('|$)"
      skip: "\\\\'"
      rules:
        - constant.specialChar: "\\\\u[0-9a-fA-F]{4}"
        - constant.specialChar: "\\\\U[0-9a-fA-F]{8}"
        - constant.specialChar: "\\\\0[0-7]{2}"
        - constant.specialChar: "\\\\x[0-9a-fA-F]{2}"
        - constant.specialChar: "\\\\[abnrtv0\\\\'\"]"
    # byte strings
  - constant.string:
      start: "(?i)(b|br|rb)\"\"\""
      end: "\"\"\""
      rules:
        - constant.specialChar: "\\\\0[0-7]{2}"
        - constant.specialChar: "\\\\x[0-9a-fA-F]{2}"
        - constant.specialChar: "\\\\[abnrtv0\\\\'\"]"
  - constant.string:
      start: "(?i)(b|br|rb)'''"
      end: "'''"
      rules:
        - constant.specialChar: "\\\\0[0-7]{2}"
        - constant.specialChar: "\\\\x[0-9a-fA-F]{2}"
        - constant.specialChar: "\\\\[abnrtv0\\\\'\"]"
  - constant.string:
      start: "(?i)(b|br|rb)\""
      end: "(\"|$)"
      skip: '\\"'
      rules:
        - constant.specialChar: "\\\\0[0-7]{2}"
        - constant.specialChar: "\\\\x[0-9a-fA-F]{2}"
        - constant.specialChar: "\\\\[abnrtv0\\\\'\"]"
  - constant.string:
      start: "(?i)(b|br|rb)'"
      end: "('|$)"
      skip: "\\\\'"
      rules:
        - constant.specialChar: "\\\\0[0-7]{2}"
        - constant.specialChar: "\\\\x[0-9a-fA-F]{2}"
        - constant.specialChar: "\\\\[abnrtv0\\\\'\"]"
    # comments
  - comment:
      start: "#"
      end: "$"
      rules:
          # code tags
        - todo: "\\b(NOBUG|RVD)\\b:?"
        - todo: "\\?\\?\\?|\\b(HACK|PORT|CAVEAT)\\b:?"
        - todo: "\\!\\!\\!|\\b(FIXME|BUG)\\b:?"
        - todo: "\\b(TODO|REQ|RFE|IDEA|NOTE|FAQ|GLOSS|SEE|TODOC|CRED|STAT)\\b:?"
